<!--
  template.html - interactive 3D mind map page (mindmap-3d skill)
  Author:  Jibril Sulaiman (with Claude Code)
  Date:    2026-11-19
  Lives:   .claude/skills/mindmap-3d/assets/template.html; filled in by scripts/build_mindmap.py
  What:    Full-screen dark 3D force-directed map with glow, labelled hubs, color by status or
           group, show/hide legend, search, click-to-focus side panel, extra-links toggle and
           fullscreen. Placeholders: {{TITLE}}, {{SUBTITLE}}, {{GRAPH_DATA}}.
  Why:     Reusable version of a 3D site map first built for a website sweep.
-->
<title>{{TITLE}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: one full-screen dark canvas; title, controls, legend and panel float over it. Single dark look on purpose. */
:root{--bg:#05070a;--fg:#e8f0eb;--muted:#8fa59a;--line:#2c3b33;--chip:rgba(20,28,24,.85);--accent:#3ddc84;
  --body:"Inter",system-ui,sans-serif;--display:"Space Grotesk",system-ui,sans-serif;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);margin:0}
[hidden]{display:none!important}
.mm-top{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:5;padding-top:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.mm-top h1{margin:0;font:700 18px var(--display);color:#fff}
.mm-top p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.g-wrap{position:fixed;inset:0;background:var(--bg);overflow:hidden}
.g-wrap.embed{position:relative;inset:auto;height:min(78vh,720px);min-height:460px;border-radius:10px;border:1px solid #1d2a24}
#g3{position:absolute;inset:0}
.g-ctl{position:absolute;top:calc(62px + env(safe-area-inset-top,0px));left:10px;right:10px;display:flex;flex-wrap:wrap;gap:6px;z-index:2}
.g-wrap.embed .g-ctl{top:10px}
.g-ctl input,.g-ctl select,.g-ctl button,.g-legend button,.g-near button{font:13px var(--body);color:var(--fg);background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:6px 10px;min-height:34px}
.g-ctl input{flex:1 1 180px;min-width:0}
.g-ctl button{cursor:pointer}
.g-ctl button[aria-pressed=true]{background:#1f7a52;border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.g-legend{position:absolute;left:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:2;display:flex;flex-direction:column;gap:4px;max-height:45%;overflow:auto;padding-right:4px}
.g-legend button{display:flex;align-items:center;gap:6px;text-align:left;cursor:pointer}
.g-legend button.off{opacity:.35}
.g-legend span{color:var(--muted);font-variant-numeric:tabular-nums}
.g-legend i,.g-near i{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none;box-shadow:0 0 8px currentColor}
.g-sub{color:var(--muted);font-size:12px}
.g-panel{position:absolute;top:calc(112px + env(safe-area-inset-top,0px));right:10px;width:min(340px,calc(100% - 20px));max-height:calc(100% - 122px);overflow:auto;z-index:3;background:rgba(10,15,12,.94);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13px}
.g-wrap.embed .g-panel{top:56px;max-height:calc(100% - 66px)}
.g-panel h2{margin:6px 0 2px;font:600 15px var(--display);color:#fff;word-break:break-word}
.g-panel a{color:#7cf29c;font-size:12px;word-break:break-all}
.g-panel ul{margin:8px 0 0;padding-left:18px}
.g-chip{display:inline-block;color:#06120c;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:2px 8px;border-radius:4px}
.g-x{float:right;background:none;border:0;color:#cfd9d3;font-size:20px;cursor:pointer;line-height:1}
.g-near{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.g-near button{display:flex;align-items:center;gap:8px;text-align:left;cursor:pointer;min-height:30px}
.g-fallback{position:absolute;inset:0;display:grid;place-items:center;color:#cfd9d3;padding:24px;text-align:center}
@media (max-width:600px){.g-ctl{top:calc(80px + env(safe-area-inset-top,0px))}.g-legend{max-height:30%}.g-panel{top:auto;bottom:10px;max-height:55%}}
</style>
<!--MM-START-->
<div class="mm-top"><h1>{{TITLE}}</h1><p>{{SUBTITLE}}</p></div>
<div class="g-wrap" id="gwrap">
  <div id="g3" role="img" aria-label="Interactive 3D mind map"></div>
  <div class="g-ctl">
    <input id="gsearch" type="search" placeholder="Search" aria-label="Search the map">
    <select id="gcolor" aria-label="Color the map by">
      <option value="status">Color by status</option>
      <option value="group">Color by group</option>
    </select>
    <button type="button" id="glabels" aria-pressed="false">Labels</button>
    <button type="button" id="gextra" aria-pressed="false" hidden>More links</button>
    <button type="button" id="greset">Reset view</button>
    <button type="button" id="gfull">Fullscreen</button>
  </div>
  <div class="g-legend" id="glegend"></div>
  <div class="g-panel" id="gpanel" hidden></div>
  <div class="g-fallback" id="gfallback" hidden>This 3D map needs WebGL, which this browser has turned off. Try it on a computer or another browser.</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three-spritetext@1.8.2/dist/three-spritetext.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/3d-force-graph@1.73.4/dist/3d-force-graph.min.js"></script>
<script>
(function () {
  const DATA = {{GRAPH_DATA}};
  const el = document.getElementById('g3'), wrap = document.getElementById('gwrap');
  const panel = document.getElementById('gpanel'), legend = document.getElementById('glegend');
  const STATUS = DATA.statuses || { ok: ['#3ddc84', 'Works'], broken: ['#ff5252', 'Broken'], old: ['#ffb020', 'Outdated'], ext: ['#4da3ff', 'External'], hub: ['#ffffff', 'Group hub'] };
  const st = s => STATUS[s] || ['#9aa7a0', s || 'Unknown'];
  const PALETTE = ['#7cf29c', '#ff6b9d', '#5ad1ff', '#ffd166', '#c792ff', '#ff9f43', '#4dffd2', '#f78fb3', '#9be15d', '#70a1ff', '#ff7675', '#ffeaa7', '#a29bfe', '#55efc4', '#fab1a0', '#81ecec', '#dfe6e9'];
  DATA.nodes.forEach(n => { n.notes = n.notes || []; n.group = n.group || 'Other'; n.status = n.status || (n.kind === 'hub' || n.kind === 'root' ? 'hub' : 'ok'); });
  const groups = [...new Set(DATA.nodes.map(n => n.group))];
  const GCOL = Object.fromEntries(groups.map((g, i) => [g, PALETTE[i % PALETTE.length]]));
  const deg = {}; DATA.links.forEach(l => { deg[l.source] = (deg[l.source] || 0) + 1; deg[l.target] = (deg[l.target] || 0) + 1; });
  let mode = 'status', showLabels = false, showExtra = false, focus = null;
  const hiddenStatus = new Set(), hiddenGroups = new Set();
  const byId = Object.fromEntries(DATA.nodes.map(n => [n.id, n]));
  const nb = {};
  DATA.links.forEach(l => { (nb[l.source] = nb[l.source] || new Set()).add(l.target); (nb[l.target] = nb[l.target] || new Set()).add(l.source); });
  if (DATA.links.some(l => l.kind === 'extra')) document.getElementById('gextra').hidden = false;
  const isHub = n => n.kind === 'hub' || n.kind === 'root';
  const color = n => mode === 'status' ? st(n.status)[0] : (isHub(n) ? '#ffffff' : GCOL[n.group]);
  const size = n => n.kind === 'root' ? 12 : n.kind === 'hub' ? 8.5 : Math.min(3.2 + Math.sqrt(deg[n.id] || 1) * 0.7, 8);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  let ok = true;
  try { const c = document.createElement('canvas'); ok = !!(window.WebGLRenderingContext && (c.getContext('webgl') || c.getContext('experimental-webgl'))); } catch (e) { ok = false; }
  if (!ok || !window.ForceGraph3D || !window.THREE) { document.getElementById('gfallback').hidden = false; return; }

  const glowTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
    const r = g.createRadialGradient(32, 32, 0, 32, 32, 32); r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(0.25, 'rgba(255,255,255,0.55)'); r.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = r; g.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c); })();

  function nodeObj(n) {
    const grp = new THREE.Group(), col = new THREE.Color(color(n)), s = size(n);
    const dim = focus && focus !== n.id && !(nb[focus] && nb[focus].has(n.id));
    grp.add(new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: col, transparent: true, opacity: dim ? 0.05 : 0.85, blending: THREE.AdditiveBlending, depthWrite: false })));
    grp.children[0].scale.set(s * 4.2, s * 4.2, 1);
    grp.add(new THREE.Mesh(new THREE.SphereGeometry(s * 0.55, 16, 12), new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: dim ? 0.12 : 1 })));
    const fewNear = focus && nb[focus] && nb[focus].size <= 25;
    if ((isHub(n) || (showLabels && !dim) || n.id === focus || (fewNear && !dim)) && window.SpriteText) {
      const t = new SpriteText(isHub(n) ? n.label : (n.label.length > 42 ? n.label.slice(0, 40) + '...' : n.label));
      t.color = dim ? 'rgba(255,255,255,0.2)' : (isHub(n) ? '#ffffff' : '#dfe8e3');
      t.textHeight = isHub(n) ? 6 : 3.2; t.fontWeight = isHub(n) ? 'bold' : 'normal';
      t.position.y = -(s + 3.2); grp.add(t);
    }
    return grp;
  }

  function data() {
    const nodes = DATA.nodes.filter(n => !hiddenStatus.has(n.status) && !hiddenGroups.has(n.group));
    const keep = new Set(nodes.map(n => n.id));
    return { nodes, links: DATA.links.filter(l => keep.has(l.source) && keep.has(l.target) && (showExtra || l.kind !== 'extra')).map(l => ({ ...l })) };
  }

  const LCOL = { spine: 'rgba(255,255,255,0.35)', hub: 'rgba(255,255,255,0.10)', flow: 'rgba(255,209,102,0.6)', good: 'rgba(61,220,132,0.6)', bad: 'rgba(255,82,82,0.7)', extra: 'rgba(255,255,255,0.08)' };
  const sid = x => typeof x === 'object' ? x.id : x;
  const G = ForceGraph3D()(el)
    .backgroundColor('#05070a').showNavInfo(false).nodeThreeObject(nodeObj)
    .nodeLabel(n => `<div style="font:13px Inter,system-ui,sans-serif;max-width:320px"><b>${esc(n.label)}</b><br>${esc(st(n.status)[1])} · ${esc(n.group)}${n.notes.length ? '<br>' + esc(n.notes[0]) : ''}</div>`)
    .linkColor(l => (focus && sid(l.source) !== focus && sid(l.target) !== focus) ? 'rgba(255,255,255,0.03)' : (LCOL[l.kind] || 'rgba(255,255,255,0.16)'))
    .linkWidth(l => l.kind === 'spine' ? 1.2 : (l.kind === 'flow' || l.kind === 'good' || l.kind === 'bad') ? 0.6 : 0)
    .linkDirectionalParticles(l => (l.kind === 'flow' || l.kind === 'good') ? 2 : 0)
    .linkDirectionalParticleWidth(1.2).linkDirectionalParticleSpeed(0.006)
    .onNodeClick(n => select(n.id, true)).onBackgroundClick(() => select(null))
    .graphData(data());
  G.d3Force('charge').strength(-34).distanceMax(260);
  G.d3Force('link').distance(l => l.kind === 'spine' ? 120 : l.kind === 'hub' ? 34 : l.kind === 'extra' ? 60 : 26);
  let fitted = false;
  G.cooldownTicks(160).onEngineStop(() => { if (!fitted) { fitted = true; G.zoomToFit(900, 30); } });

  function fit() { G.width(el.clientWidth).height(el.clientHeight); }
  fit(); window.addEventListener('resize', fit);
  document.addEventListener('fullscreenchange', () => setTimeout(fit, 60));
  function refresh() { G.nodeThreeObject(nodeObj); G.linkColor(G.linkColor()); }

  function select(id, fly) {
    focus = id; refresh();
    if (!id) { panel.hidden = true; return; }
    const n = byId[id], live = G.graphData().nodes.find(x => x.id === id);
    if (fly && live && live.x !== undefined) {
      const r = 1 + 230 / Math.hypot(live.x || 1, live.y || 1, live.z || 1);
      G.cameraPosition({ x: live.x * r, y: live.y * r, z: live.z * r }, live, 1200);
    }
    const near = [...(nb[id] || [])].map(x => byId[x]).filter(Boolean)
      .sort((a, b) => (b.status === 'broken') - (a.status === 'broken') || a.label.localeCompare(b.label));
    panel.innerHTML = `<button type="button" class="g-x" aria-label="Close">×</button>
      <div class="g-chip" style="background:${st(n.status)[0]}">${esc(st(n.status)[1])}</div>
      <h2>${esc(n.label)}</h2>${n.title ? `<div class="g-sub">${esc(n.title)}</div>` : ''}<div class="g-sub">${esc(n.group)}</div>
      ${n.url ? `<a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.url)}</a>` : ''}
      ${n.notes.length ? '<ul>' + n.notes.map(x => `<li>${esc(x)}</li>`).join('') + '</ul>' : ''}
      <div class="g-sub" style="margin-top:8px">Connected to ${near.length}:</div>
      <div class="g-near">${near.slice(0, 40).map(x => `<button type="button" data-id="${esc(x.id)}"><i style="background:${st(x.status)[0]}"></i>${esc(x.label.length > 50 ? x.label.slice(0, 48) + '...' : x.label)}</button>`).join('')}${near.length > 40 ? `<div class="g-sub">and ${near.length - 40} more</div>` : ''}</div>`;
    panel.hidden = false;
    panel.querySelector('.g-x').onclick = () => select(null);
    panel.querySelectorAll('.g-near button').forEach(b => b.onclick = () => select(b.dataset.id, true));
  }

  function drawLegend() {
    const used = new Set(DATA.nodes.map(n => n.status));
    const items = mode === 'status'
      ? Object.keys(STATUS).filter(k => used.has(k)).map(k => ({ key: 's:' + k, col: STATUS[k][0], label: STATUS[k][1], n: DATA.nodes.filter(x => x.status === k).length, off: hiddenStatus.has(k) }))
      : groups.map(g => ({ key: 'g:' + g, col: GCOL[g], label: g, n: DATA.nodes.filter(x => x.group === g).length, off: hiddenGroups.has(g) }));
    legend.innerHTML = '<div class="g-sub">Tap to show or hide</div>' + items.map(i => `<button type="button" data-k="${esc(i.key)}" class="${i.off ? 'off' : ''}" aria-pressed="${!i.off}"><i style="background:${i.col}"></i>${esc(i.label)} <span>${i.n}</span></button>`).join('');
    legend.querySelectorAll('button').forEach(b => b.onclick = () => {
      const k = b.dataset.k, v = k.slice(2), set = k[0] === 's' ? hiddenStatus : hiddenGroups;
      set.has(v) ? set.delete(v) : set.add(v); G.graphData(data()); drawLegend();
    });
  }
  drawLegend();

  document.getElementById('gcolor').onchange = e => { mode = e.target.value; drawLegend(); refresh(); };
  const lb = document.getElementById('glabels');
  lb.onclick = () => { showLabels = !showLabels; lb.setAttribute('aria-pressed', showLabels); refresh(); };
  const xb = document.getElementById('gextra');
  xb.onclick = () => { showExtra = !showExtra; xb.setAttribute('aria-pressed', showExtra); G.graphData(data()); };
  document.getElementById('greset').onclick = () => { hiddenStatus.clear(); hiddenGroups.clear(); select(null); G.graphData(data()); drawLegend(); setTimeout(() => G.zoomToFit(800, 40), 600); };
  document.getElementById('gfull').onclick = () => { try { (document.fullscreenElement ? document.exitFullscreen() : wrap.requestFullscreen()).catch(() => {}); } catch (e) {} };
  document.getElementById('gsearch').addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const q = e.target.value.trim().toLowerCase(); if (!q) return;
    const hit = DATA.nodes.find(n => n.label.toLowerCase().includes(q) || (n.url || '').toLowerCase().includes(q) || (n.title || '').toLowerCase().includes(q));
    if (hit) { hiddenStatus.delete(hit.status); hiddenGroups.delete(hit.group); G.graphData(data()); drawLegend(); setTimeout(() => select(hit.id, true), 300); }
  });
})();
</script>
<!--MM-END-->
